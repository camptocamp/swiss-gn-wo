volumes:
  elasticsearch_data:
  postgresql_data:

services:
  database:
    image:  postgis/postgis:14-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p
      POSTGRES_DB: gn1
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - 5433:5432

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.13
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms1G -Xmx1G
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300

  gn:
    image: ghcr.io/camptocamp/swiss-gn-wo/gn-with-swiss-overlay:4.4.9-53
    environment:
      - GEONETWORK_DB_HOST=database
      - GEONETWORK_DB_NAME=gn1
      - GEONETWORK_DB_PASSWORD=p
      - GEONETWORK_DB_USERNAME=postgres
      - GEONETWORK_DB_PORT=5432
      - JAVA_OPTS=-Dgeonetwork.dir=/mnt/geonetwork_data/ -Dgeonetwork.schema.dir=/usr/local/tomcat/webapps/geonetwork/WEB-INF/data/config/schema_plugins -Des.url=http://elasticsearch:9200 -Des.host=elasticsearch -Dgeonetwork.db.type=postgres-postgis-hikari -Ddb.pool.maxActive=250
    ports:
      - 8080:8080

